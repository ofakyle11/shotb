<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CINAMATE — Not found</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--base:#0A1628;--card:#12253A;--line:#24435F;--patina:#8BA3B8;--brass:#C9A86C;--text:#E8EEF2}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#132A44 0%,var(--base) 60%);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:24px}
.card{width:min(440px,94vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:38px 32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px;font-family:Cinzel,serif;font-weight:700;font-size:22px;letter-spacing:.14em}
.logo img{width:26px;height:26px}
.logo span{color:var(--brass)}
.code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--patina);letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px}
h1{font-family:Cinzel,serif;font-size:19px;font-weight:700;margin-bottom:12px}
p{font-size:13px;color:#A0B4C8;line-height:1.7}
.links{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;background:linear-gradient(180deg,#6699C4,#4A7CA8);color:#0A1628;font-weight:600;font-size:13px;padding:10px 20px;border-radius:8px;text-decoration:none;letter-spacing:.03em}
a.ghost{background:none;border:1px solid var(--line);color:var(--patina)}
a.btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="/assets/logo-mark.svg" alt="">CINA<span>MATE</span></div>
  <p class="code">404 — no such page</p>
  <h1>That page isn’t here</h1>
  <p>The link may be out of date, or the page may live inside the studio — the working modules are behind sign-in and aren’t reachable from a public address.</p>
  <div class="links">
    <a class="btn" href="/">Front page</a>
    <a class="btn ghost" href="/login.html">Sign in</a>
  </div>
</main>
</body>
</html>
