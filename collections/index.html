<script>
"use strict";

/* =====================================================================
   RECEIVABLES COMMAND CENTER
   Adapted from the PC Staffing Command Center architecture:
   single-file app · localStorage persistence · login gate · tabbed UI.
   Purpose: track companies that aren't paying their bills, show the
   current balance owed, and send escalating missed-payment reminders.
   ===================================================================== */

// ---------- storage keys ----------
const K = {
  user:     'arc_user_v1',
  settings: 'arc_settings_v1',
  accounts: 'arc_accounts_v1',
  invoices: 'arc_invoices_v1',
  reminders:'arc_reminders_v1',
  activity: 'arc_activity_v1'
};

// ---------- state ----------
let CU = null;              // current user
let S  = {};                // settings
let ACCOUNTS = [];          // companies that owe money
let INVOICES = [];          // invoices (money owed)
let REMINDERS = [];         // reminder send log
let ACTIVITY = [];          // activity feed
let cur = 'dash';           // current tab
let draftCtx = null;        // account currently in the reminder draft modal

const TB = [
  {id:'dash',     i:'📊', l:'Dashboard'},
  {id:'accounts', i:'🏢', l:'Accounts'},
  {id:'invoices', i:'🧾', l:'Invoices'},
  {id:'remind',   i:'📧', l:'Reminders'},
  {id:'log',      i:'📜', l:'Activity'},
  {id:'settings', i:'⚙️', l:'Settings'}
];

// Escalation ladder: suggested reminder level by days past due.
const LEVELS = [
  {n:1, key:'friendly', label:'Friendly Reminder', minDays:1,  badge:'bb'},
  {n:2, key:'firstnotice', label:'Past-Due Notice', minDays:15, badge:'by'},
  {n:3, key:'secondnotice', label:'Urgent — 2nd Notice', minDays:31, badge:'bor'},
  {n:4, key:'finalnotice', label:'FINAL NOTICE', minDays:61, badge:'br'}
];

// ---------- utilities ----------
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function r2(n){return Math.round((Number(n)||0)*100)/100}
function money(n){try{return new Intl.NumberFormat('en-CA',{style:'currency',currency:S.currency||'CAD'}).format(r2(n))}catch(e){return '$'+r2(n).toFixed(2)}}
function parseMoney(v){const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:r2(n)}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'})}
function daysPast(dueISO){if(!dueISO)return 0;const ms=new Date(todayISO()+'T12:00:00')-new Date(dueISO+'T12:00:00');return Math.floor(ms/86400000)}
function addDays(iso,d){const dt=new Date((iso||todayISO())+'T12:00:00');dt.setDate(dt.getDate()+Number(d||0));return dt.toISOString().slice(0,10)}

async function sha(s){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ // crypto.subtle unavailable (rare non-secure contexts) — fallback hash
    let h=5381; for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}
    return 'djb2_'+(h>>>0).toString(16);
  }
}

function showToast(msg,type){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast'+(type==='err'?' err':'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3200);
}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.remove())}
function modal(html,maxw){
  closeModals();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="modal-content"'+(maxw?' style="max-width:'+maxw+'"':'')+'>'+html+'</div>';
  m.addEventListener('click',e=>{if(e.target===m)m.remove()});
  document.body.appendChild(m);return m;
}
function mhead(title){return '<div class="modal-head"><div>'+title+'</div><button class="bt bo" data-act="closeModal" style="font-size:16px;line-height:1">×</button></div>'}

// ---------- computed: balances, aging, status ----------
function invPaid(inv){return r2((inv.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0))}
function invRemaining(inv){return Math.max(0,r2((Number(inv.amount)||0)-invPaid(inv)))}
function invStatus(inv){
  const rem=invRemaining(inv);
  if(rem<=0)return 'paid';
  if(invPaid(inv)>0)return 'partial';
  return 'open';
}
function acctInvoices(aId){return INVOICES.filter(i=>i.accountId===aId)}
function acctBalance(aId){return r2(acctInvoices(aId).reduce((s,i)=>s+invRemaining(i),0))}
function acctOverdue(aId){return r2(acctInvoices(aId).filter(i=>invRemaining(i)>0&&daysPast(i.dueDate)>0).reduce((s,i)=>s+invRemaining(i),0))}
function acctMaxDaysLate(aId){
  let mx=0;
  acctInvoices(aId).forEach(i=>{if(invRemaining(i)>0){const d=daysPast(i.dueDate);if(d>mx)mx=d}});
  return mx;
}
function acctStatus(a){
  const bal=acctBalance(a.id);
  if(bal<=0)return {key:'settled',label:'PAID UP',badge:'bg'};
  const d=acctMaxDaysLate(a.id);
  if(d<=0)return {key:'current',label:'CURRENT',badge:'bc'};
  if(d<=30)return {key:'overdue',label:'OVERDUE '+d+'d',badge:'by'};
  if(d<=60)return {key:'delinquent',label:'DELINQUENT '+d+'d',badge:'bor'};
  return {key:'collections',label:'COLLECTIONS '+d+'d',badge:'br'};
}
function lastReminder(aId){return REMINDERS.find(r=>r.accountId===aId)||null}
function suggestedLevel(a){
  const d=acctMaxDaysLate(a.id);
  if(d<=0)return null;
  let lvl=LEVELS[0];
  LEVELS.forEach(L=>{if(d>=L.minDays)lvl=L});
  const last=lastReminder(a.id);
  if(last&&last.level>=lvl.n)lvl=LEVELS[Math.min(last.level,3)]; // escalate one past last sent (cap final)
  return lvl;
}
function daysSinceReminder(aId){
  const last=lastReminder(aId);
  if(!last)return Infinity;
  return Math.floor((Date.now()-new Date(last.ts).getTime())/86400000);
}
function reminderDueNow(a){
  if(acctOverdue(a.id)<=0)return false;
  if(a.promiseDate&&daysPast(a.promiseDate)<=0)return false;      // active promise-to-pay
  return daysSinceReminder(a.id)>=(Number(S.cadenceDays)||5);      // don't nag more often than cadence
}
function agingBuckets(){
  const b={current:0,d30:0,d60:0,d90:0,d90p:0};
  INVOICES.forEach(i=>{
    const rem=invRemaining(i);if(rem<=0)return;
    const d=daysPast(i.dueDate);
    if(d<=0)b.current=r2(b.current+rem);
    else if(d<=30)b.d30=r2(b.d30+rem);
    else if(d<=60)b.d60=r2(b.d60+rem);
    else if(d<=90)b.d90=r2(b.d90+rem);
    else b.d90p=r2(b.d90p+rem);
  });
  return b;
}
function totals(){
  const out=r2(INVOICES.reduce((s,i)=>s+invRemaining(i),0));
  const od=r2(INVOICES.filter(i=>daysPast(i.dueDate)>0).reduce((s,i)=>s+invRemaining(i),0));
  const delinquent=ACCOUNTS.filter(a=>acctOverdue(a.id)>0).length;
  let collected30=0;
  const cutoff=addDays(todayISO(),-30);
  INVOICES.forEach(i=>(i.payments||[]).forEach(p=>{if((p.date||'')>=cutoff)collected30=r2(collected30+(Number(p.amount)||0))}));
  return {out,od,delinquent,collected30};
}

// ---------- reminder templates ----------
function invoiceTableText(aId){
  const rows=acctInvoices(aId).filter(i=>invRemaining(i)>0)
    .sort((x,y)=>(x.dueDate||'').localeCompare(y.dueDate||''));
  if(!rows.length)return '  (no open invoices)';
  const lines=rows.map(i=>{
    const d=daysPast(i.dueDate);
    const age=d>0?d+' day'+(d===1?'':'s')+' past due':'due '+fmtDate(i.dueDate);
    return '  • Invoice '+(i.number||'—')+'  |  issued '+fmtDate(i.issueDate)+'  |  '+age+'  |  '+money(invRemaining(i))+' outstanding';
  });
  return lines.join('\n');
}
function tplVars(a){
  const first=(a.contactName||'there').trim().split(/[\s,]+/)[0];
  return {
    first, company:a.company,
    balance:money(acctBalance(a.id)),
    overdue:money(acctOverdue(a.id)),
    days:acctMaxDaysLate(a.id),
    table:invoiceTableText(a.id),
    us:S.company||'our company',
    sender:S.senderName||'',
    email:S.senderEmail||'',
    phone:S.senderPhone||'',
    pay:S.payInstructions||'Please contact us to arrange payment.'
  };
}
function sigBlock(v){
  return 'Thank you,\n'+(v.sender?v.sender+'\n':'')+v.us+(v.phone?'\n'+v.phone:'')+(v.email?'\n'+v.email:'');
}
function buildReminder(a,lvlN){
  const v=tplVars(a);
  const L=LEVELS.find(x=>x.n===lvlN)||LEVELS[0];
  const wasReminded=REMINDERS.some(r=>r.accountId===a.id);
  let subject='',body='';
  if(L.n===1){
    subject='Friendly reminder — balance of '+v.balance+' with '+v.us;
    body='Hi '+v.first+',\n\nJust a friendly reminder from '+v.us+' — our records show '+v.company+' has an outstanding balance of '+v.balance+', of which '+v.overdue+' is now past due.\n\nOpen invoices:\n'+v.table+'\n\nIf payment is already on its way, please disregard this note (and thank you!). Otherwise, we\'d appreciate payment at your earliest convenience.\n\nHow to pay:\n'+v.pay+'\n\nIf anything looks off with these invoices, just reply and we\'ll sort it out quickly.\n\n'+sigBlock(v);
  }else if(L.n===2){
    subject='Past-due notice — '+v.overdue+' outstanding ('+v.days+' days)';
    body='Hi '+v.first+',\n\nThis is a past-due notice from '+v.us+'. '+v.company+'\'s account currently shows a total balance of '+v.balance+', including '+v.overdue+' that is now '+v.days+' days past due.\n\nOpen invoices:\n'+v.table+'\n\nWe\'d appreciate payment within the next 7 days, or a quick reply letting us know when we can expect it.\n\nHow to pay:\n'+v.pay+'\n\nIf there is an issue with any invoice, or you\'d like to discuss a payment plan, please reply or call — we\'re happy to work with you.\n\n'+sigBlock(v);
  }else if(L.n===3){
    subject='Second notice — overdue balance of '+v.overdue+' requires attention';
    body='Hello '+v.first+',\n\n'+(wasReminded?'Despite our previous reminder, ':'Our records show that ')+v.company+'\'s account with '+v.us+' remains unpaid. The current balance is '+v.balance+', with '+v.overdue+' now '+v.days+' days past due.\n\nOpen invoices:\n'+v.table+'\n\nPlease arrange payment, or contact us with a firm payment date, within 5 business days of this notice.'+(S.lateFeeNote?'\n\nPlease note: '+S.lateFeeNote:'')+'\n\nHow to pay:\n'+v.pay+'\n\nWe value the relationship and would much rather resolve this together — please get in touch today.\n\n'+sigBlock(v);
  }else{
    subject='FINAL NOTICE — '+v.overdue+' past due on '+v.company+'\'s account';
    body='Dear '+v.first+',\n\nThis is a final notice regarding '+v.company+'\'s seriously past-due account with '+v.us+'. The outstanding balance is '+v.balance+', of which '+v.overdue+' is '+v.days+' days past due'+(wasReminded?' despite multiple reminders':'')+'.\n\nOpen invoices:\n'+v.table+'\n\nUnless payment — or a written commitment with a firm payment date — is received within 10 days, we may have no choice but to suspend the account and refer the balance to a collection agency, which could affect '+v.company+'\'s credit standing.'+(S.lateFeeNote?'\n\nPlease note: '+S.lateFeeNote:'')+'\n\nHow to pay:\n'+v.pay+'\n\nWe would sincerely prefer to resolve this directly. Please contact us immediately.\n\n'+sigBlock(v);
  }
  return {subject,body,level:L.n,levelLabel:L.label};
}

// ---------- boot / auth ----------
function show(id){['S','L','A'].forEach(x=>document.getElementById(x).style.display=x===id?(x==='A'?'block':'flex'):'none')}

async function firstRunCreate(){
  const co=document.getElementById('suCo').value.trim();
  const nm=document.getElementById('suNm').value.trim();
  const em=document.getElementById('suEm').value.trim();
  const ph=document.getElementById('suPh').value.trim();
  const curcy=document.getElementById('suCur').value;
  const u=document.getElementById('suU').value.trim().toLowerCase();
  const p=document.getElementById('suP').value;
  const err=document.getElementById('suErr');
  if(!co){err.textContent='Business name is required';return}
  if(!u||!p){err.textContent='Choose a username and password';return}
  if(p.length<6){err.textContent='Password must be at least 6 characters';return}
  const hash=await sha(u+'::'+p);
  localStorage.setItem(K.user,JSON.stringify({u,hash,name:nm||u}));
  S=Object.assign({
    company:co,senderName:nm,senderEmail:em,senderPhone:ph,currency:curcy,
    cadenceDays:5,
    payInstructions:'E-transfer: '+(em||'ar@yourcompany.com')+'\nOr call us at '+(ph||'our office')+' to pay by card.',
    lateFeeNote:'',
    emailjsPublic:'',emailjsService:'',emailjsTemplate:''
  },S);
  saveSettingsLS();
  logA('Workspace created for '+co,'🟢');
  CU={u,name:nm||u};
  boot();
}

async function login(){
  const u=document.getElementById('inu').value.toLowerCase().trim();
  const p=document.getElementById('inp').value;
  const e=document.getElementById('lerr');
  let rec=null;try{rec=JSON.parse(localStorage.getItem(K.user))}catch(_){}
  if(!rec){e.textContent='No account on this browser — reload to run setup';return}
  const hash=await sha(u+'::'+p);
  if(u===rec.u&&hash===rec.hash){CU={u,name:rec.name};boot()}
  else e.textContent='Invalid credentials';
}
function logout(){CU=null;show('L');document.getElementById('inu').value='';document.getElementById('inp').value='';document.getElementById('lerr').textContent=''}

function boot(){
  show('A');
  document.getElementById('zCo').textContent=S.company||'Trickster Inc';
  document.getElementById('zU').textContent='👤 '+(CU.name||CU.u);
  document.getElementById('zN').innerHTML=TB.map(t=>'<div class="ni'+(t.id===cur?' on':'')+'" data-act="go" data-id="'+t.id+'">'+t.i+' '+t.l+'</div>').join('');
  go(cur);
}
function updHeader(){
  const t=totals();
  document.getElementById('zTot').textContent=money(t.out);
  document.getElementById('zOd').textContent=money(t.od);
}

// ---------- navigation / rendering ----------
function go(id){
  cur=id;
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  const el=document.getElementById('zC');
  if(id==='dash')el.innerHTML=pDash();
  else if(id==='accounts')el.innerHTML=pAccounts();
  else if(id==='invoices')el.innerHTML=pInvoices();
  else if(id==='remind')el.innerHTML=pRemind();
  else if(id==='log')el.innerHTML=pLog();
  else if(id==='settings')el.innerHTML=pSettings();
  updHeader();
}

  const bucketRow=(label,val,color)=>'<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:9px;margin-bottom:3px"><span style="color:var(--tx2)">'+label+'</span><b class="mo">'+money(val)+'</b></div><div class="pb"><div class="pf" style="width:'+Math.round(val/maxB*100)+'%;background:'+color+'"></div></div></div>';
  const queue=ACCOUNTS.filter(a=>acctOverdue(a.id)>0)
    .sort((x,y)=>acctOverdue(y.id)-acctOverdue(x.id));
  const dueNow=queue.filter(reminderDueNow);
  const topDebt=[...ACCOUNTS].map(a=>({a,bal:acctBalance(a.id)})).filter(x=>x.bal>0).sort((x,y)=>y.bal-x.bal).slice(0,6);
  return '<div class="fa">'
    +'<div class="g4">'
    +'<div class="mc"><div class="mcl">Total Outstanding</div><div class="mcv mo" style="color:var(--y)">'+money(t.out)+'</div><div class="mcc">all open invoices</div></div>'
    +'<div class="mc"><div class="mcl">Past Due</div><div class="mcv mo" style="color:var(--r)">'+money(t.od)+'</div><div class="mcc">'+t.delinquent+' account'+(t.delinquent===1?'':'s')+' behind</div></div>'
    +'<div class="mc"><div class="mcl">Reminders Due Now</div><div class="mcv" style="color:var(--o)">'+dueNow.length+'</div><div class="mcc">ready to send today</div></div>'
    +'<div class="mc"><div class="mcl">Collected (30d)</div><div class="mcv mo" style="color:var(--g)">'+money(t.collected30)+'</div><div class="mcc">payments recorded</div></div>'
    +'</div>'
    +'<div class="g2" style="margin-top:10px">'
    +'<div class="cd"><div class="ct_">📅 Aging Buckets</div>'
      +bucketRow('Current (not yet due)',b.current,'var(--c)')
      +bucketRow('1–30 days past due',b.d30,'var(--y)')
      +bucketRow('31–60 days past due',b.d60,'var(--o)')
      +bucketRow('61–90 days past due',b.d90,'#f97316')
      +bucketRow('90+ days past due',b.d90p,'var(--r)')
    +'</div>'
    +'<div class="cd"><div class="ct_">🔥 Top Balances</div>'
      +(topDebt.length?topDebt.map(x=>{
        const st=acctStatus(x.a);
        return '<div class="lg clickable" data-act="openAccount" data-id="'+x.a.id+'"><span class="b '+st.badge+'">'+st.label+'</span><b style="flex:1">'+esc(x.a.company)+'</b><span class="mo" style="color:var(--y)">'+money(x.bal)+'</span></div>';
      }).join(''):'<div style="font-size:10px;color:var(--tx2)">No open balances. Add accounts and invoices to get started.</div>')
    +'</div></div>'
    +'<div class="cd"><div class="ct_">📧 Reminder Queue — Send Today</div>'
    +(dueNow.length?'<table class="tb"><thead><tr><th>Company</th><th>Contact</th><th>Overdue</th><th>Days Late</th><th>Last Reminder</th><th>Suggested</th><th></th></tr></thead><tbody>'
      +dueNow.slice(0,8).map(a=>remRow(a)).join('')+'</tbody></table>'
      +(dueNow.length>8?'<div style="font-size:9px;color:var(--tx2);margin-top:6px">+'+(dueNow.length-8)+' more in the Reminders tab</div>':'')
     :'<div style="font-size:10px;color:var(--tx2)">Nothing due right now. '+(queue.length?'Accounts recently reminded or under promise-to-pay are held back by your '+(S.cadenceDays||5)+'-day cadence.':'No overdue accounts — nice.')+'</div>')
    +'</div>'
    +(ACCOUNTS.length===0?'<div class="cd" style="text-align:center"><div style="font-size:11px;color:var(--tx2);margin-bottom:8px">New here? Import your customer + invoice CSVs in Settings, or try the demo data.</div><button class="bt bp" data-act="loadDemo">Load Demo Data</button> <button class="bt bo" data-act="go" data-id="settings">Open Settings</button></div>':'')

    +'<td class="mo" style="color:var(--r)">'+money(acctOverdue(a.id))+'</td>'

    +'<td style="font-size:9px">'+(last?('L'+last.level+' · '+fmtDate(last.ts.slice(0,10))):'never')+'</td>'
    +'<td>'+(lvl?'<span class="b '+lvl.badge+'">L'+lvl.n+' '+lvl.label+'</span>':'—')+'</td>'
    +'<td><button class="bt bp" data-act="draftReminder" data-id="'+a.id+'">Draft Reminder</button></td></tr>';

// ----- invoices -----
function pInvoices(){
  const f=window._invFilter||'unpaid';
  const all=[...INVOICES].sort((x,y)=>(x.dueDate||'').localeCompare(y.dueDate||''));
  const rows=all.filter(i=>{
    const st=invStatus(i);
    if(f==='all')return true;
    if(f==='unpaid')return st!=='paid';
    if(f==='overdue')return st!=='paid'&&daysPast(i.dueDate)>0;
    return st===f;
  });
  return '<div class="fa"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">'

// ----- reminders -----
function pRemind(){
  const behind=ACCOUNTS.filter(a=>acctOverdue(a.id)>0).sort((x,y)=>acctOverdue(y.id)-acctOverdue(x.id));
  const dueNow=behind.filter(reminderDueNow);
  const held=behind.filter(a=>!reminderDueNow(a));
  return '<div class="fa"><h2 style="font-size:14px;font-weight:800;margin-bottom:4px">📧 Payment Reminders</h2>'
    +'<div style="font-size:9px;color:var(--tx2);margin-bottom:10px">Escalation ladder: '+LEVELS.map(L=>'L'+L.n+' '+L.label+' ('+L.minDays+'d+)').join(' → ')+' · cadence '+(S.cadenceDays||5)+' days between reminders</div>'
    +'<div class="cd"><div class="ct_">🚨 Due Now ('+dueNow.length+')</div>'
    +(dueNow.length?'<div style="overflow-x:auto"><table class="tb"><thead><tr><th>Company</th><th>Contact</th><th>Overdue</th><th>Days Late</th><th>Last Reminder</th><th>Suggested</th><th></th></tr></thead><tbody>'+dueNow.map(a=>remRow(a)).join('')+'</tbody></table></div>'
     :'<div style="font-size:10px;color:var(--tx2)">No reminders due right now.</div>')+'</div>'
    +(held.length?'<div class="cd"><div class="ct_">⏸ Held Back ('+held.length+')</div><div style="font-size:9px;color:var(--tx2);margin-bottom:8px">Overdue, but recently reminded or under an active promise-to-pay.</div>'
      +held.map(a=>{
        const ptp=a.promiseDate&&daysPast(a.promiseDate)<=0;
        const ds=daysSinceReminder(a.id);
        return '<div class="lg"><b class="clickable" data-act="openAccount" data-id="'+a.id+'" style="flex:1">'+esc(a.company)+'</b>'
        +(ptp?'<span class="b bpu">PTP '+fmtDate(a.promiseDate)+(a.promiseAmount?' · '+money(a.promiseAmount):'')+'</span>':'<span class="b bb">reminded '+(isFinite(ds)?ds+'d ago':'—')+'</span>')
        +'<span class="mo" style="color:var(--r)">'+money(acctOverdue(a.id))+'</span>'
        +'<button class="bt bo" data-act="draftReminder" data-id="'+a.id+'">Draft Anyway</button></div>';

    +(REMINDERS.length?'<div style="overflow-x:auto"><table class="tb"><thead><tr><th>When</th><th>Company</th><th>Level</th><th>Subject</th><th>Balance Then</th><th>Via</th></tr></thead><tbody>'

      }).join('')+'</tbody></table></div>'
     :'<div style="font-size:10px;color:var(--tx2)">No reminders logged yet.</div>')+'</div></div>';

function saveAccount(id){
  const co=document.getElementById('afCo').value.trim();

    contactName:document.getElementById('afNm').value.trim(),
    contactEmail:document.getElementById('afEm').value.trim(),
    contactPhone:document.getElementById('afPh').value.trim(),
    terms:Math.max(0,parseInt(document.getElementById('afTe').value)||30),
    notes:document.getElementById('afNo').value.trim()

    ACCOUNTS.push(Object.assign({id:uid('a'),createdAt:new Date().toISOString(),promiseDate:'',promiseAmount:0},data));
    logA('Account added: '+co,'🏢');
  }
  saveAccounts();closeModals();go(id?cur:'accounts');

  const a=ACCOUNTS.find(x=>x.id===id);if(!a)return;

  ACCOUNTS=ACCOUNTS.filter(x=>x.id!==id);
  INVOICES=INVOICES.filter(x=>x.accountId!==id);
  REMINDERS=REMINDERS.filter(x=>x.accountId!==id);
  saveAccounts();saveInvoices();saveReminders();

function saveInvoice(){
  const accountId=document.getElementById('ifAcct').value;
  const amount=parseMoney(document.getElementById('ifAmt').value);
  if(!accountId||amount<=0){showToast('Account and a positive amount are required','err');return}
  const paid=parseMoney(document.getElementById('ifPaid').value);
  const inv={
    id:uid('i'),accountId,
    number:document.getElementById('ifNum').value.trim()||('INV-'+String(INVOICES.length+1001)),
    issueDate:document.getElementById('ifIss').value||todayISO(),
    dueDate:document.getElementById('ifDue').value||addDays(todayISO(),30),
    amount,payments:[],createdAt:new Date().toISOString()
  };
  if(paid>0)inv.payments.push({date:todayISO(),amount:Math.min(paid,amount),method:'import',note:'entered with invoice'});

// ---------- CSV / backup ----------
function dlFile(name,content,type){
  const blob=new Blob([content],{type:type||'text/plain'});
  const url=URL.createObjectURL(blob);
  const el=document.createElement('a');el.href=url;el.download=name;el.click();
  URL.revokeObjectURL(url);
}
function csvCell(v){
  v=(v==null?'':String(v)).replace(/"/g,'""');
  return /[",\n]/.test(v)?'"'+v+'"':v;
}
function exportAcctCSV(){
  const head=['company','contactName','contactEmail','contactPhone','terms','notes','balance','pastDue','daysLate','status'];
  const lines=[head.join(',')].concat(ACCOUNTS.map(a=>{
    return [a.company,a.contactName,a.contactEmail,a.contactPhone,a.terms||30,a.notes,acctBalance(a.id),acctOverdue(a.id),acctMaxDaysLate(a.id),acctStatus(a).key].map(csvCell).join(',');
  }));
  dlFile('accounts-'+todayISO()+'.csv',lines.join('\n'),'text/csv');
}
function exportInvCSV(){
  const head=['company','number','issueDate','dueDate','amount','amountPaid','outstanding','status','daysLate'];
  const lines=[head.join(',')].concat(INVOICES.map(i=>{
    const a=ACCOUNTS.find(x=>x.id===i.accountId);
    return [a?a.company:'?',i.number,i.issueDate,i.dueDate,i.amount,invPaid(i),invRemaining(i),invStatus(i),Math.max(0,daysPast(i.dueDate))].map(csvCell).join(',');
  }));
  dlFile('invoices-'+todayISO()+'.csv',lines.join('\n'),'text/csv');
}
function parseCSV(text){
  const rows=[];let row=[],cell='',inQ=false;
  text=text.replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else inQ=false}
      else cell+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){row.push(cell);cell=''}
      else if(ch==='\n'){row.push(cell);cell='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[]}
      else cell+=ch;
    }
  }
  row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row);
  return rows;
}
function findOrCreateAccount(company){
  const key=company.trim().toLowerCase();
  let a=ACCOUNTS.find(x=>x.company.trim().toLowerCase()===key);
  if(!a){a={id:uid('a'),company:company.trim(),contactName:'',contactEmail:'',contactPhone:'',terms:30,notes:'',promiseDate:'',promiseAmount:0,createdAt:new Date().toISOString()};ACCOUNTS.push(a)}
  return a;
}
function importAcctCSV(text){
  const rows=parseCSV(text);if(rows.length<2){showToast('CSV appears empty','err');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=n=>head.indexOf(n.toLowerCase());
  const iCo=col('company');if(iCo<0){showToast('CSV needs a "company" column','err');return}
  let added=0,updated=0;
  rows.slice(1).forEach(r=>{
    const co=(r[iCo]||'').trim();if(!co)return;
    const existing=ACCOUNTS.find(x=>x.company.trim().toLowerCase()===co.toLowerCase());
    const a=findOrCreateAccount(co);
    if(existing)updated++;else added++;
    const set=(name,field,tf)=>{const ix=col(name);if(ix>=0&&r[ix]!=null&&r[ix].trim()!=='')a[field]=tf?tf(r[ix].trim()):r[ix].trim()};
    set('contactname','contactName');set('contactemail','contactEmail');set('contactphone','contactPhone');
    set('terms','terms',v=>Math.max(0,parseInt(v)||30));set('notes','notes');
  });
  saveAccounts();
  logA('Accounts CSV imported — '+added+' added, '+updated+' updated','📥');
  showToast(added+' accounts added, '+updated+' updated');
  go('accounts');
}
function importInvCSV(text){
  const rows=parseCSV(text);if(rows.length<2){showToast('CSV appears empty','err');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=n=>head.indexOf(n.toLowerCase());
  const iCo=col('company'),iAmt=col('amount');
  if(iCo<0||iAmt<0){showToast('CSV needs "company" and "amount" columns','err');return}
  let added=0;
  rows.slice(1).forEach((r,ix)=>{
    const co=(r[iCo]||'').trim();const amount=parseMoney(r[iAmt]);
    if(!co||amount<=0)return;
    const a=findOrCreateAccount(co);
    const num=col('number')>=0?(r[col('number')]||'').trim():'';
    const iss=col('issuedate')>=0?(r[col('issuedate')]||'').trim():'';
    const due=col('duedate')>=0?(r[col('duedate')]||'').trim():'';
    const paid=col('amountpaid')>=0?parseMoney(r[col('amountpaid')]):0;
    const inv={
      id:uid('i'),accountId:a.id,
      number:num||('IMP-'+Date.now().toString(36)+'-'+ix),
      issueDate:/^\d{4}-\d{2}-\d{2}$/.test(iss)?iss:todayISO(),
      dueDate:/^\d{4}-\d{2}-\d{2}$/.test(due)?due:addDays(iss||todayISO(),a.terms||30),
      amount,payments:[],createdAt:new Date().toISOString()
    };
    if(paid>0)inv.payments.push({date:todayISO(),amount:Math.min(paid,amount),method:'import',note:'from CSV'});
    INVOICES.push(inv);added++;
  });
  saveAccounts();saveInvoices();
  logA('Invoices CSV imported — '+added+' invoices','📥');
  showToast(added+' invoices imported');
  go('invoices');
}
function backup(){
  dlFile('receivables-backup-'+todayISO()+'.json',JSON.stringify({
    exportedAt:new Date().toISOString(),settings:S,accounts:ACCOUNTS,invoices:INVOICES,reminders:REMINDERS,activity:ACTIVITY
  },null,2),'application/json');
  logA('Backup exported','💾');
}
function restore(text){
  let d;try{d=JSON.parse(text)}catch(e){showToast('Not a valid backup file','err');return}
  if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.invoices)){showToast('Not a valid backup file','err');return}
  if(!confirm('Restore this backup? It REPLACES all current accounts, invoices and reminder history.'))return;
  S=Object.assign({},S,d.settings||{});ACCOUNTS=d.accounts;INVOICES=d.invoices;REMINDERS=d.reminders||[];ACTIVITY=d.activity||[];
  saveSettingsLS();saveAccounts();saveInvoices();saveReminders();saveActivity();
  logA('Backup restored','💾');
  boot();showToast('Backup restored');
}

document.addEventListener('change',e=>{
  if(e.target.id==='invFilter'){window._invFilter=e.target.value;go('invoices')}
  if(e.target.id==='fileRestore'||e.target.id==='fileAcct'||e.target.id==='fileInv'){
    const f=e.target.files[0];if(!f)return;
    const which=e.target.id;
    const rd=new FileReader();
    rd.onload=ev=>{
      if(which==='fileRestore')restore(ev.target.result);
      else if(which==='fileAcct')importAcctCSV(ev.target.result);
      else importInvCSV(ev.target.result);
    };
    rd.readAsText(f);e.target.value='';
  }
});
