<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CINAMATE — Sign in</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--base:#0A1628;--card:#12253A;--card2:#1A2F4A;--line:#24435F;--patina:#8BA3B8;--blue:#5B8DB8;--brass:#C9A86C;--text:#E8EEF4}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#132A44 0%,var(--base) 60%);color:var(--text);font-family:Inter,system-ui,sans-serif}
.card{width:min(400px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;font-family:Cinzel,serif;font-weight:700;font-size:22px;letter-spacing:.14em}
.logo img{width:26px;height:26px}
.logo span{color:var(--brass)}
.sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--patina);text-align:center;letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}
label{display:block;font-size:11px;color:var(--patina);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font-size:14px;font-family:"IBM Plex Mono",monospace}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;margin-top:22px;background:linear-gradient(180deg,#6699C4,#4A7CA8);border:none;border-radius:8px;color:#0A1628;font-weight:600;font-size:14px;padding:12px;cursor:pointer;letter-spacing:.04em}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:wait}
.err{margin-top:14px;font-size:12px;color:#E08A8A;text-align:center;min-height:16px}
.note{margin-top:18px;font-size:11px;color:var(--patina);text-align:center;line-height:1.6}
.note a{color:var(--brass);text-decoration:none}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo"><img src="/assets/logo-mark.svg" alt="">CINA<span>MATE</span></div>
  <p class="sub">Production access — owners only</p>
  <label for="n">Login</label>
  <input id="n" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="go">Enter the studio</button>
  <p class="err" id="err"></p>
  <p class="note">This is the working studio, not the tour — the public overview lives on the <a href="/">front page</a>.</p>
</form>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  function dest() {
    try {
      var to = new URLSearchParams(location.search).get('to') || '/dashboard.html';
      /* same-site paths only — never an off-site redirect */
      if (to.charAt(0) !== '/' || to.charAt(1) === '/') return '/dashboard.html';
      return to;
    } catch (e) { return '/dashboard.html'; }
  }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.textContent = '';
    go.disabled = true;
    var name = document.getElementById('n').value.trim().toLowerCase();
    var pw = document.getElementById('p').value;
    fetch('/.netlify/functions/verify-owner', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, password: pw })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j || !res.j.token) {
          go.disabled = false;
          err.textContent = 'That login didn’t match — check the name and password.';
          return;
        }
        var maxAge = 12 * 60 * 60;
        document.cookie = 'cin_owner=' + encodeURIComponent(res.j.token) +
          '; Path=/; Max-Age=' + maxAge + '; Secure; SameSite=Lax';
        try {
          sessionStorage.setItem('cinamate.session',
            JSON.stringify({ operator: String(res.j.name || name).toUpperCase(), t: Date.now() }));
        } catch (e) { /* private mode */ }
        location.replace(dest());
      })
      .catch(function () {
        go.disabled = false;
        err.textContent = 'Could not reach the sign-in service — try again.';
      });
  });
})();
</script>
</body>
</html>
