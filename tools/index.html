<script>
(function(){
  var rail=document.getElementById('tkRail');
  var initialized={};
  function activate(name){
    Array.prototype.forEach.call(rail.querySelectorAll('button[data-tab]'),function(b){
      b.classList.toggle('on',b.getAttribute('data-tab')===name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tk-pane'),function(p){
      p.classList.toggle('hidden',p.id!=='pane-'+name);
    });
    if(!initialized[name]&&window.TTabs&&TTabs[name]){initialized[name]=true;TTabs[name]();}
    try{history.replaceState(null,'','#'+name);}catch(e){}
  }
  rail.addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]');
    if(b)activate(b.getAttribute('data-tab'));
  });
  var h=(location.hash||'').replace('#','');
  activate(document.getElementById('pane-'+h)?h:'takes');
  window.addEventListener('hashchange',function(){
    var t=(location.hash||'').replace('#','');
    if(document.getElementById('pane-'+t))activate(t);
  });
})();
</script>
