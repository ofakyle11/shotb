# ══════════════════════════════════════════════════════════════════════
# DO NOT publish the repository root. The application is served ONLY from
# inside the gate function to signed-in owners; publishing "." would put
# every module on the public CDN with no sign-in in front of it. If a git
# build is ever connected to a site, it publishes a placeholder instead of
# the studio — fail closed. Real releases go out via
#   node scripts/deploy_cinamate.mjs cinamate-studio
# ══════════════════════════════════════════════════════════════════════
[build]
  publish = "netlify-git-guard"
  # Functions fail closed for the same reason publish does. Pointing this at
  # netlify/functions would have let a git build deploy all 23 endpoints —
  # prompt relays, paid model calls, seeding, the Stripe webhook — with no
  # owner check in front of them, while the static half of the very same
  # build correctly served nothing but a placeholder. A release uploads the
  # three endpoints it needs by hand: scripts/deploy_cinamate.mjs.
  functions = "netlify-git-guard/functions"

[functions]
  node_bundler = "esbuild"

[functions."generate-video"]
  timeout = 60

[functions."serve-openai-video"]
  timeout = 60

[functions."enrich-characters"]
  timeout = 60

[functions."enrich-locations"]
  timeout = 60

# These headers reach a git build only. netlify.toml is on the deploy exclusion
# list (scripts/deploy_cinamate.mjs:80), and a git build publishes the
# fail-closed placeholder — so this block hardens the placeholder, never the
# studio. The real policies are `_headers` (public shell) and the CSP inside
# netlify/functions/gate.js (every gated page); scripts/test_csp_parity.mjs
# holds those two identical and checks this block is no looser than either.
# Deliberately NO Content-Security-Policy here: two hand-maintained copies of
# one policy have already drifted once, and a third would be worse.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/timeline/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/timeline/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Block ops/internal files — force=true overrides static file serving (_redirects alone cannot).
[[redirects]]
  from = "/DO_THIS_NOW.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/MINIMAL_DO_THIS_NOW.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/POST_IMPLEMENTATION_CHECKLIST.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/FIX_ALL_DEPLOY.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/OWNER_LOGIN.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/get-owner-token.ps1"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.grok/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/private/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/app/"
  to = "/app.html"
  status = 200

# NOTHING here auto-deploys. `functions = "netlify-git-guard/functions"` above
# is an empty directory on purpose, so a git build ships no endpoint at all,
# and `publish` ships a placeholder rather than the studio. A release is an
# explicit, hand-driven upload of the shell, the gate bundle and the three
# endpoints it needs:
#   node scripts/deploy_cinamate.mjs cinamate-studio
# (test_deploy_exclusions.mjs pins both fail-closed settings. The comment that
# used to sit here claimed the exact opposite and would have talked the next
# reader straight through the guard.)