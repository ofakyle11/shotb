<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cinamate — geometric diamond aperture mark">
  <!-- CINAMATE primary logo — Brand Identity Toolkit, Blue Patina Edition §2:
       nested diamond frames with stepped Art Deco geometry surrounding a
       central multi-ring aperture; raised spherical lens element at the core.
       Approved color version 1: Blue Patina #8BA3B8 line-work (dark grounds). -->
  <defs>
    <radialGradient id="cmLens" cx="0.42" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#9FBDD8"/>
      <stop offset="0.45" stop-color="#4C7196"/>
      <stop offset="0.8" stop-color="#1D3450"/>
      <stop offset="1" stop-color="#142639"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="#8BA3B8" stroke-width="2.6" stroke-linejoin="miter">
    <!-- stepped background square — corners emerge on the diagonals -->
    <rect x="50" y="50" width="100" height="100" opacity="0.9"/>

    <!-- interlocking side wings (Greek-key channels), east / west -->
    <g opacity="0.95">
      <rect x="136.5" y="86" width="42" height="28"/>
      <rect x="170" y="91" width="18" height="18"/>
      <rect x="21.5" y="86" width="42" height="28"/>
      <rect x="12"  y="91" width="18" height="18"/>
    </g>

    <!-- nested diamond frames -->
    <polygon points="100,12 188,100 100,188 12,100"/>
    <polygon points="100,27 173,100 100,173 27,100"/>

    <!-- stepped point details, north / south -->
    <polygon points="100,33 109,42 100,51 91,42"/>
    <polygon points="100,149 109,158 100,167 91,158"/>
  </g>

  <!-- multi-ring aperture -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#8BA3B8" stroke-width="5.5"/>
  <circle cx="100" cy="100" r="27" fill="none" stroke="#8BA3B8" stroke-width="2" opacity="0.7"/>
  <circle cx="100" cy="100" r="23.5" fill="#0A1628" stroke="#8BA3B8" stroke-width="1" stroke-opacity="0.45"/>

  <!-- raised spherical lens element -->
  <circle cx="100" cy="100" r="14" fill="url(#cmLens)"/>
  <ellipse cx="94.5" cy="93" rx="4" ry="2.6" fill="#E8EEF2" opacity="0.85"
           transform="rotate(-25 94.5 93)"/>
</svg>
